<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蠔油薯仔炆雞翼 | 語音控制 POC | 李錦記</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <div class="header-brand">
        <span class="logo-text">李錦記</span>
        <span class="poc-badge">Web Speech API POC</span>
      </div>
      <a href="en.html" class="lang-switch" hreflang="en">English</a>
    </div>
  </header>

  <nav class="breadcrumb" aria-label="breadcrumb">
    <div class="container">
      <span>首頁</span>
      <span class="sep">/</span>
      <span>美味食譜</span>
      <span class="sep">/</span>
      <span>蠔油薯仔炆雞翼</span>
    </div>
  </nav>

  <main class="container">
    <section class="recipe-hero">
      <img
        src="https://cdn-akamai.lkk.com/-/media/oyster-flavoured-braised-chicken-wings-with-potatoes_600x465.jpg?h=465&iar=0&w=600"
        alt="蠔油薯仔炆雞翼"
        class="recipe-image"
      >
      <div class="recipe-meta">
        <h1>蠔油薯仔炆雞翼</h1>
        <ul class="meta-icons">
          <li>準備時間 <strong>10 分鐘</strong></li>
          <li>烹煮時間 <strong>15 分鐘</strong></li>
          <li>份量 <strong>4 人</strong></li>
        </ul>
        <p class="source-link">
          原型頁面：
          <a href="https://hk.lkk.com/zh-hk/recipes/oyster-flavoured-braised-chicken-wings-with-potatoes" target="_blank" rel="noopener">
            hk.lkk.com 食譜
          </a>
        </p>
      </div>
    </section>

    <section class="voice-panel" aria-label="語音控制">
      <h2>語音控制</h2>
      <p class="voice-hint">
        說出指令控制朗讀烹調步驟：
        <strong>開始</strong>、<strong>下一步</strong>、<strong>上一步</strong>、<strong>返回第 X 步</strong>（例如：返回第 2 步）
      </p>

      <div class="voice-controls">
        <button type="button" id="mic-toggle" class="btn btn-primary" aria-pressed="false">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          開啟語音聆聽
        </button>
        <button type="button" id="btn-start" class="btn">開始</button>
        <button type="button" id="btn-prev" class="btn">上一步</button>
        <button type="button" id="btn-next" class="btn">下一步</button>
        <button type="button" id="btn-stop" class="btn btn-muted">停止朗讀</button>
      </div>

      <div class="status-bar" role="status" aria-live="polite">
        <span id="status-listening" class="status-chip hidden">聆聽中…</span>
        <span id="status-speaking" class="status-chip hidden">朗讀中…</span>
        <span id="status-message" class="status-message">按「開啟語音聆聽」或「開始」開始體驗</span>
      </div>

      <p id="last-command" class="last-command" aria-live="polite"></p>
    </section>

    <section class="steps-section">
      <h2 class="recipe-main-title">烹調步驟</h2>
      <ol id="steps-list" class="steps-list"></ol>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>POC 僅用於驗證 Web Speech API（文字轉語音 + 語音指令）於食譜烹調步驟的應用。</p>
    </div>
  </footer>

  <script src="config.zh-HK.js"></script>
  <script src="voice-control.js"></script>
</body>
</html>
